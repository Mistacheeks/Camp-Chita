<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Camp Chita</title>

<!-- ======================================================
     GOOGLE FONTS
======================================================= -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

/* ======================================================
   RESET
======================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:'Montserrat',sans-serif;

    background:#000;
}

/* ======================================================
   HERO SECTION
======================================================= */

.hero{
    position:relative;

    width:100%;
    height:100vh;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
}

/* ======================================================
   BACKGROUND
======================================================= */

.hero-bg{
    position:absolute;

    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,.42),
        rgba(0,0,0,.72)
    ),
    url('images/hero-bg.jpg')
    center center/cover no-repeat;

    animation:
    cinematicZoom 18s ease-in-out infinite alternate;
}

/* ======================================================
   LIGHT RAYS
======================================================= */

.light-rays{
    position:absolute;

    inset:0;

    background:
    radial-gradient(
        ellipse at center,
        rgba(255,210,120,.14),
        transparent 65%
    );

    mix-blend-mode:screen;

    animation:
    pulseRays 6s ease-in-out infinite;
}

/* ======================================================
   CONTENT
======================================================= */

.hero-content{
    position:relative;

    z-index:20;

    max-width:1000px;

    padding:20px;
}

/* ======================================================
   TOP ICON
======================================================= */

.top-icon{
    width:120px;

    margin:0 auto 35px auto;

    opacity:.95;

    filter:
    drop-shadow(0 0 20px rgba(214,190,134,.35));

    animation:
    floatIcon 4s ease-in-out infinite;
}

/* ======================================================
   TITLE
======================================================= */

    /* TITLE */
    .landing-title{
        margin:0;
        line-height:.95;
        font-family:'Montserrat',sans-serif;
        font-weight:800;
        letter-spacing:-2px;
    }

    .landing-title .camp{
        color:#404040;
        font-size:92px;
    }

    .landing-title .chita{
        color:#d4a017;
        font-size:92px;
    }

    /* SUBTITLE */
    .landing-subtitle{
        margin-top:18px;
        color:#fff;
        font-size:22px;
        font-weight:500;
        letter-spacing:5px;
        font-family:'Montserrat',sans-serif;
        text-transform:capitalize;
        opacity:.92;
    }

    .camp{
        color:#404040;
        -webkit-text-stroke: 1px rgba(220,220,220,.85);
        text-shadow:
            0 2px 10px rgba(0,0,0,.25),
            0 0 1px rgba(255,255,255,.35);
    }

    .chita{
        color:#d4a017;
        -webkit-text-stroke: 1.2px #404040;
        text-stroke: 1.2px #404040;
        text-shadow:
        0 2px 10px rgba(0,0,0,.22);
    }

.hero-title{
    font-family:'Cinzel',serif;

    font-size:120px;

    font-weight:600;

    letter-spacing:8px;

    color:#f7f2e8;

    line-height:1;

    margin-bottom:28px;

    text-shadow:
    0 8px 25px rgba(0,0,0,.35);

    animation:
    fadeUp 1.2s ease;
}

/* ======================================================
   DIVIDER
======================================================= */

.divider{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:18px;

    margin-bottom:28px;

    animation:
    fadeUp 1.4s ease;
}

.divider-line{
    width:120px;
    height:1px;

    background:
    linear-gradient(
        to right,
        transparent,
        rgba(214,190,134,.85),
        transparent
    );
}

.divider-dot{
    width:12px;
    height:12px;

    background:#d6be86;

    transform:rotate(45deg);
}

/* ======================================================
   SUBTITLE
======================================================= */

.subtitle{
    color:#d6be86;

    font-size:16px;

    letter-spacing:5px;

    text-transform:uppercase;

    margin-bottom:36px;

    animation:
    fadeUp 1.6s ease;
}

/* ======================================================
   DESCRIPTION
======================================================= */

.description{
    max-width:720px;

    margin:0 auto 70px auto;

    font-size:22px;

    line-height:1.9;

    color:rgba(255,255,255,.84);

    animation:
    fadeUp 1.8s ease;
}

/* ======================================================
   ENTER BUTTON
======================================================= */

.enter-wrapper{
    position:relative;

    display:inline-flex;
    flex-direction:column;
    align-items:center;

    text-decoration:none;

    animation:
    fadeUp 2s ease;
}

/* ======================================================
   LARGE TENT ICON
======================================================= */

.main-tent{
    width:300px;

    cursor:pointer;

    transition:
    transform .45s ease,
    filter .45s ease;

    filter:
    drop-shadow(0 0 20px rgba(214,190,134,.18));
}

.enter-wrapper:hover .main-tent{

    transform:
    scale(1.05)
    translateY(-8px);

    filter:
    drop-shadow(0 0 35px rgba(214,190,134,.45));
}

/* ======================================================
   ENTER TEXT
======================================================= */

.enter-text{
    display:flex;
    align-items:center;
    gap:28px;

    margin-top:34px;

    color:#d6be86;

    text-transform:uppercase;

    letter-spacing:4px;

    font-size:18px;

    font-weight:500;
}

.enter-line{
    width:120px;
    height:1px;

    background:
    linear-gradient(
        to right,
        transparent,
        rgba(214,190,134,.85),
        transparent
    );
}

/* ======================================================
   DOWN ARROW
======================================================= */

.arrow{
    margin-top:18px;

    color:#d6be86;

    font-size:40px;

    animation:
    bounceArrow 2.5s infinite;
}

/* ======================================================
   FIREFLIES
======================================================= */

.firefly{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ffd96a;

    box-shadow:
    0 0 16px rgba(255,217,106,.9);

    animation:
    floatFirefly linear infinite;
}

.firefly:nth-child(1){
    top:18%;
    left:15%;
    animation-duration:8s;
}

.firefly:nth-child(2){
    top:30%;
    right:18%;
    animation-duration:10s;
}

.firefly:nth-child(3){
    bottom:18%;
    left:20%;
    animation-duration:9s;
}

.firefly:nth-child(4){
    bottom:22%;
    right:24%;
    animation-duration:11s;
}

.firefly:nth-child(5){
    top:14%;
    right:38%;
    animation-duration:7s;
}

.firefly:nth-child(6){
    bottom:30%;
    left:42%;
    animation-duration:12s;
}

/* ======================================================
   BOTTOM PAPER EDGE
======================================================= */

.paper-edge{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;

    z-index:30;
}

/* ======================================================
   ANIMATIONS
======================================================= */

@keyframes cinematicZoom{

    from{
        transform:scale(1.03);
    }

    to{
        transform:scale(1.12);
    }

}

@keyframes pulseRays{

    0%,100%{
        opacity:.7;
    }

    50%{
        opacity:1;
    }

}

@keyframes floatIcon{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes bounceArrow{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(10px);
    }

}

@keyframes floatFirefly{

    0%{
        transform:
        translateY(0)
        translateX(0);

        opacity:.2;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:
        translateY(-45px)
        translateX(14px);

        opacity:0;
    }

}

/* ======================================================
   MOBILE
======================================================= */

@media(max-width:768px){


    .hero-title{
        font-size:50px;

        letter-spacing:1.5px;
    }

    .subtitle{
        font-size:12px;

        letter-spacing:3px;
    }

    .description{
        font-size:17px;

        line-height:1.3;

        margin-bottom:50px;
    }

    .main-tent{
        width:150px;
    }

    .enter-text{
        font-size:14px;

        gap:14px;
    }

    .enter-line{
        width:60px;
    }

}

</style>

</head>

<body>

<section class="hero">

    <!-- BACKGROUND -->
    <div class="hero-bg"></div>

    <!-- LIGHT RAYS -->
    <div class="light-rays"></div>

    <!-- FIREFLIES -->
    <div class="firefly"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>

    <!-- CONTENT -->
    <div class="hero-content">

        <!-- TOP ICON -->
        <img src="images/tent-icon.png"
             alt="Tent Icon"
             class="top-icon">

        <!-- TITLE -->
        <h1 class="hero-title">
            CAMP CHITA
        </h1>

        <!-- DIVIDER -->
        <div class="divider">

            <div class="divider-line"></div>

            <div class="divider-dot"></div>

            <div class="divider-line"></div>

        </div>

        <!-- SUBTITLE -->
        <div class="subtitle">
            ECO TOURISM • ADVENTURE • ZAMBIA
        </div>

        <!-- DESCRIPTION -->
        <p class="description">

            Escape into Zambia’s untamed wilderness
            where adventure, tranquility and unforgettable
            outdoor experiences await.

        </p>

        <!-- ENTER BUTTON -->
        <a href="home.html"
           class="enter-wrapper"
           id="enterCamp">

            <!-- LARGE TENT -->
            <img src="images/tent-icon.png"
                 alt="Enter Camp"
                 class="main-tent">

            <!-- ENTER TEXT -->
            <div class="enter-text">

                <div class="enter-line"></div>

                <span>Enter Camp</span>

                <div class="enter-line"></div>

            </div>

            <!-- ARROW -->
            <div class="arrow">
                &#709;
            </div>

        </a>

    </div>

    <!-- PAPER EDGE -->
    <img src="images/paper-edge.png"
         alt=""
         class="paper-edge">

</section>

<!-- ======================================================
     JAVASCRIPT
======================================================= -->

<script>

/* ======================================================
   PAGE TRANSITION
======================================================= */

document.body.style.transition =
'opacity .7s ease';

document
.getElementById('enterCamp')
.addEventListener('click', function(e){

    e.preventDefault();

    document.body.style.opacity = '0';

    const target =
    this.getAttribute('href');

    setTimeout(()=>{

        window.location.href = target;

    }, 700);

});

</script>

</body>
</html>
